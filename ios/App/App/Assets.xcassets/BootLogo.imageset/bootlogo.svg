<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- First-frame snapshot of the inline #boot-overlay loader. Hand-built so
       it visually matches the CSS in index.html: concentric translucent
       circles fake the box-shadow glow, three stroked arcs match the
       border-top/right/bottom on the ring divs, and the particle sits at
       top-center where the .dd-particle::before paints at rotation 0. -->
  <!-- Faked glow around the core -->
  <circle cx="64" cy="64" r="44" fill="#0A84FF" fill-opacity="0.03"/>
  <circle cx="64" cy="64" r="30" fill="#0A84FF" fill-opacity="0.08"/>
  <circle cx="64" cy="64" r="20" fill="#0A84FF" fill-opacity="0.18"/>
  <circle cx="64" cy="64" r="14" fill="#0A84FF" fill-opacity="0.35"/>
  <!-- Core (24×24, matches .dd-core) -->
  <circle cx="64" cy="64" r="12" fill="#0A84FF"/>
  <!-- Ring 1: top arc (radius 63, primary 80%) -->
  <path d="M 19.45 19.45 A 63 63 0 0 1 108.55 19.45"
        stroke="#0A84FF" stroke-opacity="0.8" stroke-width="2" fill="none"/>
  <!-- Ring 2: right arc (radius 51, primary 40%) -->
  <path d="M 100.06 27.94 A 51 51 0 0 1 100.06 100.06"
        stroke="#0A84FF" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <!-- Ring 3: bottom arc (radius 39, primary 20%) -->
  <path d="M 91.58 91.58 A 39 39 0 0 1 36.42 91.58"
        stroke="#0A84FF" stroke-opacity="0.2" stroke-width="2" fill="none"/>
  <!-- Particle: 8×8 dot at top-center (matches .dd-particle::before) -->
  <circle cx="64" cy="4" r="4" fill="#0A84FF"/>
</svg>
