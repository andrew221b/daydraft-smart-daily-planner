# Apple IAP webhook — must accept unsigned requests from Apple servers
[functions.apple-iap-webhook]
verify_jwt = false

# Apple IAP verification — called from the native iOS client with a Supabase JWT
[functions.verify-apple-iap]
verify_jwt = true

# Cron: slot-end reminders (service-role bearer only — no user JWT).
[functions.notify-block-ends]
verify_jwt = false

# Cron: mid-day overrun "running behind" alert (service-role bearer only).
[functions.notify-overrun]
verify_jwt = false