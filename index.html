<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>DayDraft — Design your days</title>
    <meta name="description" content="Turn raw lists into focused, intelligent daily schedules. DayDraft drafts your day with AI." />
    <meta name="author" content="DayDraft" />
    <meta name="theme-color" content="#0F1115" />
    <!--
      Google Fonts removed deliberately. The font-family stacks across the
      app already prefer `-apple-system` / "SF Pro Display" / "SF Mono"
      (see src/index.css) — these are pre-loaded on every iOS device and
      look more native than the previous Google substitutes (Sora,
      Manrope, JetBrains Mono, Outfit). Dropping the synchronous CDN
      `<link>` shaves a network round-trip off cold start, which on
      flaky connections / first-launch-after-install was a measurable
      chunk of the perceived "black screen" delay.
    -->
    <!--
      Apply the resolved theme class BEFORE React mounts so the system theme is
      honoured from the very first paint on every launch (cold or warm) — no
      dark→light flash, no "system not picked up". Mirrors src/lib/theme.tsx
      (STORAGE_KEY = "daydraft.theme"; "system" follows prefers-color-scheme).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("daydraft.theme") || "system";
          var dark = t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DayDraft" />

    <meta property="og:title" content="DayDraft — Design your days" />
    <meta property="og:description" content="Turn raw lists into focused, intelligent daily schedules." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!--
      Boot-time visuals.
      • Pre-paint background matches the iOS LaunchScreen.storyboard's
        systemBackgroundColor (light: #f2f2f7, dark: #0f1115).
      • Pure CSS orbital loader paints with the first HTML byte and
        animates throughout JS download + React mount.
      • main.tsx adds `body.app-ready` once React has committed; the
        overlay then fades to opacity 0 and removes itself.
    -->
    <style>
      :root {
        color-scheme: light dark;
        background-color: #090a0c;
        --dd-boot-bg: #090a0c;
      }
      html, body, #root { background-color: inherit; }

      /*
        Boot splash — matches Native LaunchScreen exactly.
      */
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--dd-boot-bg);
        opacity: 1;
        transition: opacity 400ms ease-out;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      body.app-ready #boot-overlay { opacity: 0; }

      .boot-logo {
        width: 160px;
        height: 160px;
        /* Pure transparent logo */
        background-image: url('/isolated-logo.webp');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: bootPulse 2.5s ease-in-out infinite;
      }
      
      @keyframes bootPulse {
        0%, 100% { 
          transform: scale(1); 
          filter: drop-shadow(0 0 0px rgba(59, 130, 246, 0)) brightness(1); 
        }
        50% { 
          transform: scale(1.06); 
          filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.65)) brightness(1.15); 
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <div id="boot-overlay" aria-hidden="true">
      <div class="boot-logo"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
