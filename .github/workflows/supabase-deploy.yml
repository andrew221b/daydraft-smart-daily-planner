# Резервный деплой БД + Edge Functions через GitHub Actions.
#
# Если в Supabase Dashboard уже включена интеграция с GitHub («Deploy on push»),
# этот workflow НЕ нужен на каждый push — там деплой идёт с инфраструктуры Supabase.
# Запускайте вручную (Actions → Supabase manual deploy → Run workflow), если:
#   - нужно принудительно повторить миграции/функции;
#   - или встроенную интеграцию временно отключили.
#
# Секреты репозитория (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — Dashboard → Account → Access Tokens (sbp_…)
#   SUPABASE_PROJECT_REF   — совпадает с ref в URL: https://supabase.com/dashboard/project/<REF>
#   SUPABASE_DB_PASSWORD   — Database password (Project Settings → Database)

name: Supabase manual deploy

on:
  workflow_dispatch:

concurrency:
  group: supabase-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link remote project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push --linked

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
